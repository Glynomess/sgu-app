<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>СГУ</title>
    <!-- Подключаем Telegram WebApp API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            gap: 15px;
            font-family: sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }
        button {
            font-size: 20px;
            padding: 20px;
            border-radius: 12px;
            border: none;
            background: #e63946;
            color: #fff;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
        }
        button:active {
            background: #b71c2b;
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <button onclick="play('kryakalka.mp3')">🚨 Крякалка</button>
    <button onclick="play('sirena.mp3')">🚔 Сирена</button>
    <button onclick="play('wail.mp3')">⚠️ Wail</button>
    <button onclick="stop()">⏹ Стоп</button>

    <script>
        // Инициализация Telegram WebApp (работает, даже если открыть просто в браузере)
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        let audio = null;

        function play(file) {
            stop(); // Останавливаем предыдущий звук
            audio = new Audio(file);
            audio.loop = true; // Зацикливаем, чтобы играло постоянно
            audio.play().catch(e => console.log("Ошибка воспроизведения:", e));

            // Вибрация в Telegram (если доступно)
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }
        }

        function stop() {
            if (audio) {
                audio.pause();
                audio.currentTime = 0;
                audio = null;
            }
        }
    </script>
</body>
</html>
