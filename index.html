<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>СГУ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: url('background.jpg') center/cover no-repeat fixed;
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
        }

        /* Экраны */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100vh;
            padding: 30px;
        }

        .screen.active {
            display: flex;
        }

        /* Появление основного экрана с отскоком */
        .screen.active.enter {
            animation: slideInBounce 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes slideInBounce {
            0% {
                transform: translateY(100%) scale(0.9);
                opacity: 0;
            }
            60% {
                transform: translateY(-10px) scale(1.02);
                opacity: 1;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        /* Уход стартового экрана вверх */
        .screen.exit {
            display: flex;
            animation: slideOut 0.4s ease forwards;
        }

        @keyframes slideOut {
            from {
                transform: translateY(0);
                opacity: 1;
            }
            to {
                transform: translateY(-100%);
                opacity: 0;
            }
        }

        /* Стартовая картинка-кнопка */
        .start-btn {
            width: 200px;
            height: auto;
            cursor: pointer;
            transition: transform 0.15s, filter 0.2s;
            filter: drop-shadow(0 4px 15px rgba(0,0,0,0.8));
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            margin-bottom: 40px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* Вспышка при тапе */
        .start-btn.flash {
            animation: flash 0.5s ease;
        }

        @keyframes flash {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 4px 15px rgba(0,0,0,0.8));
            }
            30% {
                transform: scale(1.2);
                filter: drop-shadow(0 0 40px rgba(255, 80, 80, 1))
                        drop-shadow(0 0 80px rgba(255, 0, 0, 0.8))
                        brightness(1.5);
            }
            100% {
                transform: scale(1);
                filter: drop-shadow(0 4px 15px rgba(0,0,0,0.8));
            }
        }

        /* Затемнение поверх всего */
        .fade-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 999;
        }

        .fade-overlay.show {
            opacity: 1;
        }

        /* Основной экран — кнопки со звуками */
        .sound-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 320px;
            margin-bottom: 30px;
        }

        .sound-btn {
            font-size: 22px;
            padding: 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(230, 57, 70, 0.55);
            color: #fff;
            cursor: pointer;
            backdrop-filter: blur(5px);
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            font-weight:bold;
        }

        .sound-btn:active {
            background: rgba(183, 28, 43, 0.85);
            transform: scale(0.98);
        }

        /* Кнопка "Назад" */
        .back-btn {
            font-size: 16px;
            padding: 12px 30px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .back-btn:active {
            background: rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body>

    <!-- СТАРТОВЫЙ ЭКРАН -->
    <div class="screen active" id="startScreen">
        <img src="button.png" class="start-btn" onclick="goToSounds()" alt="Старт">
    </div>

    <!-- ОСНОВНОЙ ЭКРАН СО ЗВУКАМИ -->
    <div class="screen" id="soundScreen">
        <div class="sound-buttons">
            <button class="sound-btn" onclick="play('nikita.mp3')">ооой</button>
            <button class="sound-btn" onclick="play('fly.mp3')">зузузу</button>
            <button class="sound-btn" onclick="play('toplivo.mp3')">ключики на стенку</button>
        </div>
        <button class="back-btn" onclick="goToStart()">← Назад</button>
    </div>

    <!-- Затемнение -->
    <div class="fade-overlay" id="fadeOverlay"></div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        let audio = null;

        // ===== ПРЕДЗАГРУЗКА ЗВУКОВ =====
        const soundsToPreload = [
            'nikita.mp3',
            'fly.mp3',
            'toplivo.mp3'
        ];

        const preloadedSounds = {};

        soundsToPreload.forEach(file => {
            const a = new Audio();
            a.preload = 'auto';
            a.src = file;
            a.loop = true;
            preloadedSounds[file] = a;
        });

        // ===== ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ =====
        function goToSounds() {
    const start = document.getElementById('startScreen');
    const btn = document.querySelector('.start-btn');
    const overlay = document.getElementById('fadeOverlay');
    const soundScreen = document.getElementById('soundScreen');

    // Вспышка кнопки
    btn.classList.add('flash');

    // Вибрация
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
        window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
    }

    // Через 250 мс (после вспышки) — затемняем
    setTimeout(() => {
        overlay.classList.add('show');

        // Пока темно — меняем экраны
        setTimeout(() => {
            start.classList.remove('active');
            start.classList.add('exit');

            // Сбрасываем и запускаем анимацию входа заново
            soundScreen.classList.remove('enter');
            void soundScreen.offsetWidth; // форсируем перерисовку
            soundScreen.classList.add('active', 'enter');

            // Убираем затемнение
            setTimeout(() => {
                overlay.classList.remove('show');
                start.classList.remove('exit');
                btn.classList.remove('flash');
            }, 100);
        }, 400);
    }, 250);
}

        function goToStart() {
            stop();
            const start = document.getElementById('startScreen');
            const soundScreen = document.getElementById('soundScreen');
            const btn = document.querySelector('.start-btn');

            soundScreen.classList.remove('active');
            start.classList.add('active');

            // Перезапуск анимации пульсации
            btn.style.animation = 'none';
            void btn.offsetWidth;
            btn.style.animation = 'pulse 1.5s ease-in-out infinite';
        }

        // ===== ВОСПРОИЗВЕДЕНИЕ =====
        function play(file) {
            if (audio) {audio.pause();
                audio.currentTime = 0;
                if (audio.src.includes(file)) {
                    audio = null;
                    return;
                }
            }

            if (preloadedSounds[file]) {
                audio = preloadedSounds[file];
                audio.currentTime = 0;
            } else {
                audio = new Audio(file);
                audio.loop = true;
            }

            audio.play().catch(e => console.log("Ошибка:", e));

            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
        }

        function stop() {
            if (audio) {
                audio.pause();
                audio.currentTime = 0;
                audio = null;
            }
        }
    </script>
</body>
</html>
